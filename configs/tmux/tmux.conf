##### Prefix ############################################################

# Use Ctrl+a instead of tmux's default Ctrl+b.
unbind C-b
set -g prefix C-a

# Press Ctrl+a twice to send a literal Ctrl+a to the shell/program.
# Useful because Ctrl+a normally means "go to beginning of line".
bind C-a send-prefix


##### Basics ############################################################

# Enable mouse support:
#   - click panes
#   - resize panes
#   - select windows
#   - scroll in copy mode
set -g mouse on

# Scroll one history line per mouse-wheel event instead of tmux's larger
# default step. This also applies after WheelUp enters copy mode.
bind-key -T copy-mode-vi WheelUpPane send-keys -X -N 1 scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X -N 1 scroll-down

# Start window and pane numbers at 1 instead of 0.
set -g base-index 1
setw -g pane-base-index 1

# When a window is closed, renumber the remaining windows.
set -g renumber-windows on

# Larger scrollback buffer.
set -g history-limit 50000

# Reduce delay after pressing Escape.
# Helps Vim/Neovim feel more responsive inside tmux.
set -sg escape-time 10

# How long repeatable keys stay active after prefix.
#
# Example:
#   Ctrl+a Right Right Right
#
# moves across panes multiple times without pressing Ctrl+a again.
set -g repeat-time 900

# Better support for modified keys like Ctrl+Arrow / Alt+Arrow.
setw -g xterm-keys on

# Use vi-style keys in tmux copy mode.
setw -g mode-keys vi


##### Terminal / colors #################################################

# Good default terminal type for modern tmux.
set -g default-terminal "tmux-256color"

# Enable true color support in modern terminals.
set -as terminal-overrides ',*:Tc'

# Let image.nvim pass Sixel previews through tmux to WezTerm.
set -g allow-passthrough on
set -g visual-activity off
set -g focus-events on

##### Splits ############################################################

# Vertical split = side by side.
#
# Ctrl+a \      works if you release Ctrl after Ctrl+a.
# Ctrl+a Ctrl+\ works if you keep holding Ctrl.
# Ctrl+a |      old/visual alias.
# Ctrl+a v      Vim-style alias, like :vsplit.
bind \\ split-window -h -c "#{pane_current_path}"
bind C-\\ split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Horizontal split = top/bottom.
#
# Ctrl+a '      low-friction custom binding.
# Ctrl+a "      tmux's classic horizontal split binding.
# Ctrl+a -      visual alias, like a horizontal divider.
#
# Note:
#   Prefix + ' normally prompts for a window number.
#   We replace that because Prefix+w and Prefix+1..9 are usually enough.
bind "'" split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"


##### Pane jumping ######################################################

# Remove tmux's default Prefix + Arrow / Prefix + Ctrl+Arrow behavior.
# We want arrows after prefix to jump between panes, not resize.
unbind-key -q -T prefix Left
unbind-key -q -T prefix Right
unbind-key -q -T prefix Up
unbind-key -q -T prefix Down

unbind-key -q -T prefix C-Left
unbind-key -q -T prefix C-Right
unbind-key -q -T prefix C-Up
unbind-key -q -T prefix C-Down

# Prefix + Arrow = jump between panes.
#
# Because these are repeatable with -r, this works:
#
#   Ctrl+a Right Right Down Left
#
# After you pause or start typing normally, tmux leaves repeat mode.
bind-key -T prefix -r Left  select-pane -L
bind-key -T prefix -r Right select-pane -R
bind-key -T prefix -r Up    select-pane -U
bind-key -T prefix -r Down  select-pane -D

# Prefix + Ctrl+Arrow = also jump between panes.
#
# This supports the habit of pressing Ctrl+a and keeping Ctrl held:
#
#   Ctrl+a Ctrl+Right Ctrl+Right Ctrl+Down
bind-key -T prefix -r C-Left  select-pane -L
bind-key -T prefix -r C-Right select-pane -R
bind-key -T prefix -r C-Up    select-pane -U
bind-key -T prefix -r C-Down  select-pane -D

# Vim-style pane jumping.
#
#   Ctrl+a h = left
#   Ctrl+a j = down
#   Ctrl+a k = up
#   Ctrl+a l = right
bind-key -T prefix -r h select-pane -L
bind-key -T prefix -r j select-pane -D
bind-key -T prefix -r k select-pane -U
bind-key -T prefix -r l select-pane -R

# Seamless Neovim + tmux pane navigation.
#
# Ctrl+h/j/k/l moves between Neovim splits and tmux panes.
# If the active pane is Neovim, send the key into Neovim.
# Otherwise, move tmux panes directly.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|l?n?vim?x?)(diff)?$'"

bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind-key -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

##### Pane resizing #####################################################

# Vim-style resizing by 10 cells.
#
#   Ctrl+a H = resize left
#   Ctrl+a J = resize down
#   Ctrl+a K = resize up
#   Ctrl+a L = resize right
bind H resize-pane -L 10
bind J resize-pane -D 10
bind K resize-pane -U 10
bind L resize-pane -R 10

# Prefix + Alt+Arrow also resizes panes.
# This keeps the useful tmux-style behavior you wanted:
#
#   Ctrl+a Alt+Left  = resize left
#   Ctrl+a Alt+Right = resize right
#   Ctrl+a Alt+Up    = resize up
#   Ctrl+a Alt+Down  = resize down
#
# These are repeatable too.
bind-key -T prefix -r M-Left  resize-pane -L 10
bind-key -T prefix -r M-Right resize-pane -R 10
bind-key -T prefix -r M-Up    resize-pane -U 10
bind-key -T prefix -r M-Down  resize-pane -D 10


##### Windows ###########################################################

# Ctrl+a n = create a new window in the current pane's directory.
bind n new-window -c "#{pane_current_path}"

# Ctrl+a Tab = toggle between current and previous window.
bind Tab last-window

# Ctrl+a w = window/session overview.
bind w choose-tree -Zw

# Ctrl+a 1..9 still jumps to numbered windows by tmux default.


##### Closing ###########################################################

# Ctrl+a x = close the current pane.
#
# A pane is one split.
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane

# Ctrl+a Ctrl+w = close the current window.
#
# A window is the whole tmux tab, including all panes inside it.
bind C-w confirm-before -p "kill-window #W? (y/n)" kill-window


##### Custom layouts ####################################################

# Ctrl+a D creates a standard layout in the current window:
#
# ┌───────────────────────┬──────────────┐
# │                       │              │
# │        main           │   terminal   │
# │                       │              │
# │                       ├──────────────┤
# │                       │              │
# │                       │   server/log │
# └───────────────────────┴──────────────┘
#
# It splits the current pane/window in place.
bind D split-window -h -p 35 -c "#{pane_current_path}" \; \
  split-window -v -p 50 -c "#{pane_current_path}" \; \
  select-pane -L

# Ctrl+a Space cycles tmux's built-in layouts:
#   even-horizontal
#   even-vertical
#   main-horizontal
#   main-vertical
#   tiled
bind -r Space next-layout

# Ctrl+a M applies main-vertical layout directly.
bind M select-layout main-vertical


##### Sessions ##########################################################

# Ctrl+a s = session overview.
bind s choose-tree -s

# Ctrl+a d = detach from tmux.
bind d detach-client

# Ctrl+a Ctrl+d = save the tmux environment, show confirmation, then detach.
#
# The script is resurrect's own, reached through the plugin link described in
# the Plugins section at the bottom of this file.
bind C-d run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh quiet && tmux display-message "tmux environment saved; detaching" && sleep 1 && tmux detach-client -t "#{client_tty}"'


##### Copy / selection mode #############################################

# Ctrl+a [ enters copy mode.
#
# In copy mode:
#   h/j/k/l       move like Vim
#   w/b/e         move by words
#   /             search forward
#   ?             search backward
#   n/N           next/previous search result
#   v             start selection
#   V             select whole line
#   Ctrl+v        rectangle/block selection
#   y             copy selection and exit
#   Enter         copy selection and exit
#   Esc           cancel/exit
#
# Paste tmux buffer with:
#   Ctrl+a ]
bind [ copy-mode
bind ] paste-buffer

# Selection bindings for vi copy mode.
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi C-v send -X rectangle-toggle

# Copy selected text into both the tmux buffer and the system clipboard.
# Prefer native clipboard tools because OSC 52 payloads may be size-limited.
# The final `cat` keeps copying to tmux's buffer when no native tool exists.
set -g @clipboard-copy 'if command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -in; elif command -v xsel >/dev/null 2>&1; then xsel --clipboard --input; else cat >/dev/null; fi'
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel '#{@clipboard-copy}'
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel '#{@clipboard-copy}'

# Mouse selection uses the same clipboard path.
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel '#{@clipboard-copy}'

# Retain OSC 52 for terminals and remote sessions that support it.
set -g set-clipboard on


##### Rename ############################################################

# Ctrl+a R = rename current window.
bind R command-prompt -I "#{window_name}" "rename-window '%%'"

# Ctrl+a S = rename current session.
bind S command-prompt -I "#{session_name}" "rename-session '%%'"


##### Reload ############################################################

# Ctrl+a r = reload this config.
#
# Through run-shell because tmux's own `source-file` does not expand `~`: it
# resolves a relative path against the client's working directory, so the
# tilde form reported "No such file or directory" and this binding silently
# did nothing. Checked against tmux 3.6 and 3.6a.
bind r run-shell 'tmux source-file ~/.config/tmux/tmux.conf && tmux display-message "tmux config reloaded"'


##### Status bar ########################################################

# Simple bottom status bar.
set -g status-position bottom
set -g status-interval 5

# Right side:
#   session:window:pane user@host date time
#
# If tmux is running on a remote machine over SSH, this shows the remote
# user/host because the tmux server is running there.
#
# If you run local tmux and then SSH inside one pane, tmux cannot reliably
# know that pane's SSH target without extra shell integration.

#S = session
#I = window index
#P = pane index
#H = tmux host
#%H:%M = time
set -g status-right "#S:#I.#P #(whoami)@#H %H:%M"
set -g status-right-length 120


# Window list.
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W* "


##### Misc ##############################################################

# Ctrl+a q = show pane numbers.
bind q display-panes


##### Plugins ###########################################################

# There is no plugin manager here. Nix builds the three plugins and Home
# Manager links each one into ~/.config/tmux/plugins/ under its upstream
# name, so these paths are stable without a network fetch, without a lock
# file, and without a `prefix + I` first run. Loading a plugin is then just
# running its own entry script.
run-shell ~/.config/tmux/plugins/tmux-sensible/sensible.tmux

# Save the tmux environment periodically.
# Keep continuum last because it hooks status-right for periodic saves.
# Restoring is deliberately manual, with `prefix + Ctrl+r`.
run-shell 'tmux set-option -g @resurrect-dir "${XDG_STATE_HOME:-$HOME/.local/state}/tmux/resurrect"'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'off'

# Optional: persist visible pane history as text and replay it after restore.
# This can expose commands, tokens, logs, and other terminal output on disk.
# It restores historical output for context, not interactive application state.
# set -g @resurrect-capture-pane-contents 'on'

run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux

# Continuum reads @continuum-restore when it loads, so it goes last.
run-shell ~/.config/tmux/plugins/tmux-continuum/continuum.tmux
